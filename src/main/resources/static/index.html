<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常待办事项</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 32px;
            width: 100%;
            max-width: 480px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 24px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #1677ff;
            box-shadow: 0 0 0 2px rgba(22,119,255,0.1);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #4096ff; }
        button:disabled { background: #a0c4ff; cursor: not-allowed; }
        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            display: block;
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        .message.error {
            display: block;
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 新增待办事项</h1>
        <form id="todoForm">
            <div class="form-group">
                <label for="name">事项名称 *</label>
                <input type="text" id="name" name="name"
                       placeholder="请输入事项名称" maxlength="200" required>
            </div>
            <div class="form-group">
                <label for="description">描述</label>
                <textarea id="description" name="description"
                          placeholder="请输入事项描述（选填）" maxlength="2000"></textarea>
            </div>
            <button type="submit" id="submitBtn">创建待办事项</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        const form = document.getElementById('todoForm');
        const messageEl = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        function showMessage(type, text) {
            messageEl.className = 'message ' + type;
            messageEl.textContent = text;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            messageEl.className = 'message';

            const name = document.getElementById('name').value.trim();
            const description = document.getElementById('description').value.trim();

            try {
                const response = await fetch('/api/todos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description })
                });

                const result = await response.json();

                if (response.ok && result.result === 'OK') {
                    showMessage('success',
                        '✅ 创建成功！事项名称：' + result.data.name +
                        '（ID: ' + result.data.id + '）');
                    form.reset();
                } else {
                    showMessage('error', '❌ 创建失败：' + (result.msg || '未知错误'));
                }
            } catch (err) {
                showMessage('error', '❌ 网络错误：' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '创建待办事项';
            }
        });
    </script>
</body>
</html>
