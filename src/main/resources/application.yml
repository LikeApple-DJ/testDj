spring:
  application:
    name: todo-app
  datasource:
    url: jdbc:mysql://localhost:3306/todo_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 对齐设计 §1.3：事务隔离级别 ReadCommitted（MySQL InnoDB 默认为 REPEATABLE READ）
      connection-init-sql: "SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8080

# 应急开关：临时关闭待办创建入口
todo:
  create:
    enabled: true

logging:
  level:
    root: INFO
    com.antdigital.todo: INFO
