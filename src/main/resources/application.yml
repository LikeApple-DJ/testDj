spring:
  application:
    name: employee-board
  datasource:
    url: jdbc:mysql://localhost:3306/employee_board?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${EMPLOYEE_BOARD_DB_USERNAME}
    password: ${EMPLOYEE_BOARD_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
