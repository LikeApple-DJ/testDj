server:
  port: 8080

spring:
  application:
    name: todo-app
  datasource:
    url: jdbc:postgresql://localhost:5432/todo_db
    username: todo
    password: todo
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    com.example.todo: INFO
