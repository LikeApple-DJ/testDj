server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: todo-app
  datasource:
    url: jdbc:mysql://localhost:3306/todo_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

# 变更三板斧：功能开关（可灰度/可应急），todo.feature.create.enabled=false 时短路 /api/todo/create
todo:
  feature:
    create:
      enabled: true
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    property-naming-strategy: SNAKE_CASE

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.antdigital.todo.model.entity
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 5

logging:
  level:
    com.antdigital.todo: info
    com.antdigital.todo.dao.mapper: debug
