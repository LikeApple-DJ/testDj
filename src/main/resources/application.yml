server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/demo_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dtcode.demo.dao.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.dtcode.demo: INFO
    org.springframework: INFO
